<style>

.ts.on{opacity:1;visibility:visible;transform:translate(-50%,0)}.ts button{border:0;background:none;font-weight:700;color:inherit;text-decoration:underline;min-height:32px}

<body>
<div id="app">

</div>

<script>
'use strict';
/* ===== Utilidades ===== */
const $=(s,r=document)=>r.querySelector(s),p2=n=>String(n).padStart(2,'0');

const DK=/^\d{4}-\d{2}-\d{2}$/,HX=/^#[0-9a-f]{6}$/i;

const I={gear:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',prev:'<path d="M15 6l-6 6 6 6"/>',next:'<path d="M9 6l6 6-6 6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',bar:'<path d="M5 20V10M12 20V4M19 20v-7"/>'};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const CK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CLOSE=`<button class="ib" data-a="close" aria-label="Fechar">${ic('x')}</button>`;
const PAL=[['Azul','#3b82f6'],['Verde','#22c993'],['Amarelo','#f5b73a'],['Vermelho','#ef4444'],['Roxo','#a855f7'],['Rosa','#ec4899'],['Ciano','#06b6d4'],['Laranja','#f97316'],['Lima','#84cc16'],['Cinza','#94a3b8']];
const EMO=['','💪','🏃','🧘','📖','💧','🥗','😴','💊','✍️','🎯','🧹'];
const TPL=[['Treino','💪','#3b82f6'],['Beber água','💧','#06b6d4'],['Ler','📖','#f5b73a'],['Meditar','🧘','#a855f7']];
const SD=[['Estrela adormecida','#8a93aa'],['Sol azul','#38bdf8'],['Sol esverdeado','#34d399'],['Sol dourado','#f6c945'],['Sol vermelho','#ff6a3d'],['Super Sol','#ffd34d']];
const SN=['Estrela adormecida','Brilho fraco','Brilho crescente','Sol radiante','Sol intenso','Super Sol'];
const SUNS={ouro:{n:'Dourado',c:['#8a93aa','#c9a227','#e0b72f','#f6c945','#ffb020','#ffd34d']},oceano:{n:'Oceano',c:['#8a93aa','#7dd3fc','#38bdf8','#0ea5e9','#2563eb','#60a5fa']},floresta:{n:'Floresta',c:['#8a93aa','#86efac','#4ade80','#22c55e','#16a34a','#a3e635']},rosa:{n:'Rosa',c:['#8a93aa','#f9a8d4','#f472b6','#ec4899','#db2777','#fb7185']},violeta:{n:'Violeta',c:['#8a93aa','#c4b5fd','#a78bfa','#8b5cf6','#7c3aed','#d946ef']},brasa:{n:'Brasa',c:['#8a93aa','#fdba74','#fb923c','#f97316','#ef4444','#ff6a3d']}};

const K='treino-v7',OLD=['treino-pro-v5','treino-pro-v3'];
let T=key(new Date()),S,rev=0,IC=null,tab='hoje',vw='m',vy=+T.slice(0,4),vm=+T.slice(5,7)-1;

// Cada objetivo tem versões (h): editar vale a partir de hoje e o passado não muda.
function norm(o){
  const s={sv:7,name:String(o.name||'').slice(0,40),days:{},tasks:[],ew:[0,1,2,7].includes(o.ew)?o.ew:2,th:o.th==='light'||o.th==='dark'?o.th:'',sun:Object.keys(SUNS).includes(o.sun)?o.sun:'',bk:+o.bk||0,seen:!!o.seen};

  for(const t of Array.isArray(o.tasks)?o.tasks:[]){
    if(!t||typeof t!=='object')continue;

  for(const k of ks){const d=m.get(k);if(d.a){n++;best=Math.max(best,n)}else if(d.n)n=0}

  $('#pg').style.setProperty('--pc',E.col);$('#sv').disabled=!n;
}

/* ===== Camadas (foco, inert, Esc) ===== */
function openL(id,fs){
  const prev=layer?opener:document.activeElement;if(layer&&layer!==id)closeL(true);
  opener=prev;layer=id;$('#'+id).classList.add('on');if(id==='sh')$('#bk').classList.add('on');
  $('#app').inert=true;($(fs||'#'+id)).focus({preventScroll:true});
}
function closeL(quiet){
  if(!layer)return;$('#'+layer).classList.remove('on');$('#bk').classList.remove('on');$('#app').inert=false;layer=null;E=null;sel=null;
  if(!quiet&&opener&&document.contains(opener))opener.focus({preventScroll:true});
}
function kf(fn){const f=document.activeElement?.dataset?.f;fn();if(f)document.querySelector(`[data-f="${f}"]`)?.focus({preventScroll:true})}
function rSheet(){if(layer!=='sh')return;if(shk==='day'&&sel)$('#sh').innerHTML=dSheet(sel);else if(shk==='set')$('#sh').innerHTML=sSheet()}
const wide=()=>matchMedia('(min-width:900px)').matches;
function render(){
  kf(()=>{
    const r=document.documentElement;S.th?r.setAttribute('data-theme',S.th):r.removeAttribute('data-theme');
    $('#date').textContent=gtxt();
    document.querySelectorAll('.bn button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===tab?'page':'false'));
    document.querySelectorAll('.v').forEach(s=>s.classList.toggle('on',s.dataset.v===tab));
    rToday();if(wide()||tab==='hist')rHist();if(wide()||tab==='stat')rStats();rSheet();
  });
  setTimeout(()=>{lastT=null},800);
}
function gtxt(){const h=new Date().getHours(),g=h<5?'Boa noite':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite',n=S.name.trim().split(/\s+/)[0];return(n?g+', '+n+' · ':'')+fmt({weekday:'long',day:'numeric',month:'long'},parse(T))}
function toast(m,sn){const t=$('#ts');UN=sn||null;t.innerHTML=`<span>${esc(m)}</span>${sn?'<button data-a="undo">Desfazer</button>':''}`;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),6000)}
const anim=()=>{const c=$('#cal');c.classList.remove('fl','fr');void c.offsetWidth;c.classList.add(dir)};
function openDay(k){if(k>T||!(canEdit(k)||(S.days[k]||[]).length))return;sel=k;shk='day';$('#sh').innerHTML=dSheet(k);openL('sh')}
function openSet(){shk='set';$('#sh').innerHTML=sSheet();openL('sh')}
function openBk(){shk='bk';$('#sh').innerHTML=bSheet();openL('sh')}

/* ===== Eventos (delegação, sem handlers inline) ===== */
const A={
  tab:b=>{tab=b.dataset.v;render();scrollTo(0,0)},
  tog:b=>toggle(b.dataset.k,b.dataset.t),day:b=>openDay(b.dataset.k),
  mo:b=>{vm=+b.dataset.m;vw='m';dir='fr';render();anim()},
  nav:b=>{const n=+b.dataset.n;dir=n>0?'fr':'fl';if(vw==='y')vy+=n;else{vm+=n;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}}render();anim()},
  view:b=>{vw=b.dataset.v;dir='fr';render();anim()},
  home:()=>{vy=+T.slice(0,4);vm=+T.slice(5,7)-1;render();anim()},
  new:()=>openEd(),edit:b=>openEd(b.dataset.t),tpl:b=>{const x=TPL[+b.dataset.i];addTask(x[0],x[1],x[2])},
  seen:()=>{S.seen=true;save();render()},close:()=>closeL(),save:saveEd,set:openSet,backup:openBk,
  th:b=>{S.th=b.dataset.v;save();render()},ew:b=>{S.ew=+b.dataset.v;save();render()},sun:b=>{S.sun=b.dataset.v;save();render()},
  col:b=>{E.col=b.dataset.c;kf(()=>{rSw();rPv()})},em:b=>{E.e=b.dataset.e;kf(()=>{rEm();rPv()})},
  wd:b=>{const d=+b.dataset.d;if(E.w.has(d)){if(E.w.size>1)E.w.delete(d)}else E.w.add(d);kf(rWk)},
  qk:b=>{E.w=new Set([...b.dataset.w].map(Number));rWk()},
  arch:b=>drop(b.dataset.t,false),del:b=>drop(b.dataset.t,true),
  exp,imp:()=>$('#fi').click(),pi:()=>stage($('#bt').value),imps:b=>applyImp(b.dataset.m),
  cp:()=>{(navigator.clipboard?navigator.clipboard.writeText(JSON.stringify(S)):Promise.reject()).then(()=>{S.bk=Date.now();save();render();toast('Backup copiado')},()=>toast('Não foi possível copiar. Use Baixar arquivo.'))},
  undo:()=>{if(!UN)return;S=norm(JSON.parse(UN));UN=null;save();$('#ts').classList.remove('on');render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)A[b.dataset.a]?.(b)});
$('#name').addEventListener('input',e=>{S.name=e.target.value;clearTimeout(nt);nt=setTimeout(()=>{save();$('#date').textContent=gtxt()},300)});
$('#tn').addEventListener('input',rPv);
$('#tn').addEventListener('keydown',e=>{if(e.key==='Enter')saveEd()});
$('#pg').addEventListener('input',e=>{if(e.target.id!=='cc')return;E.col=e.target.value;rPv();$('#sw').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===E.col));e.target.parentNode.classList.toggle('on',!PAL.some(p=>p[1]===E.col))});
$('#sh').addEventListener('change',e=>{const f=e.target.id==='fi'&&e.target.files[0];if(f){const r=new FileReader();r.onload=()=>stage(String(r.result));r.readAsText(f)}});
document.addEventListener('keydown',e=>{
  if(!layer)return;if(e.key==='Escape'){closeL();return}if(e.key!=='Tab')return;
  const el=$('#'+layer),f=[...el.querySelectorAll('button:not([disabled]),input:not([hidden]),textarea,summary')].filter(x=>x.getClientRects().length),c=document.activeElement;if(!f.length)return;
  if(e.shiftKey&&(c===f[0]||c===el)){f[f.length-1].focus();e.preventDefault()}else if(!e.shiftKey&&c===f[f.length-1]){f[0].focus();e.preventDefault()}
});
(()=>{let x0=null,y0=0;const c=$('#cal');
  c.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  c.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)A.nav({dataset:{n:dx<0?1:-1}})},{passive:true});
})();
addEventListener('storage',e=>{if(e.key===K&&e.newValue){try{S=norm(JSON.parse(e.newValue));rev++;render()}catch{}}}); // sincroniza abas
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(nt);save();return}T=key(new Date());render()});
matchMedia('(min-width:900px)').addEventListener('change',render);
(function tick(){const n=new Date();setTimeout(()=>{T=key(new Date());render();tick()},new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,2)-n)})();

/* ===== Início ===== */
document.querySelectorAll('[data-ic]').forEach(e=>e.insertAdjacentHTML('afterbegin',ic(e.dataset.ic,e.classList.contains('pen')?16:20)));
$('#name').value=S.name;render();
try{navigator.storage?.persist?.()}catch{}
</script>
